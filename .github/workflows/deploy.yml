name: Deploy

# Every push to master goes live on FourSys. "Run workflow" on the Actions tab
# redeploys by hand. See docs/deployment.md, section 6.
on:
  push:
    branches: [master]
  workflow_dispatch:

# One deploy at a time; never cancel one halfway through an rsync.
concurrency:
  group: deploy-foursys
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to FourSys
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://orange-cobra-186442.foursyscloud.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, openssl, json

      - name: Verify before deploying
        run: php scripts/verify.php

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.FOURSYS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.FOURSYS_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::Add the FOURSYS_SSH_KEY and FOURSYS_KNOWN_HOSTS repository secrets (docs/deployment.md, section 6)."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          # The secret may hold the key file itself or a one-line base64 copy of it
          # (base64 survives copy-paste). Also repair CRLF, stray spaces, lost newlines.
          key=$(printf '%s' "$SSH_KEY" | tr -d '\r')
          if ! printf '%s' "$key" | grep -q -- '-----BEGIN'; then
            decoded=$(printf '%s' "$key" | tr -d ' \t\n' | base64 -d 2>/dev/null || true)
            if printf '%s' "$decoded" | grep -q -- '-----BEGIN'; then key=$(printf '%s' "$decoded" | tr -d '\r'); fi
          fi
          if [ "$(printf '%s\n' "$key" | wc -l)" -le 1 ]; then
            body=$(printf '%s' "$key" | sed -e 's/-----BEGIN OPENSSH PRIVATE KEY-----//' -e 's/-----END OPENSSH PRIVATE KEY-----//' | tr -d ' \t')
            key=$(printf -- '-----BEGIN OPENSSH PRIVATE KEY-----\n%s\n-----END OPENSSH PRIVATE KEY-----' "$(printf '%s' "$body" | fold -w 70)")
          fi
          printf '%s\n' "$key" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' > ~/.ssh/foursys
          chmod 600 ~/.ssh/foursys
          if ! ssh-keygen -y -f ~/.ssh/foursys > /dev/null; then
            # Describe what was pasted without printing it.
            echo "Secret length: ${#SSH_KEY} chars, $(printf '%s\n' "$SSH_KEY" | wc -l) line(s)"
            printf '%s' "$SSH_KEY" | grep -q -- '-----BEGIN OPENSSH PRIVATE KEY' && echo "Has a BEGIN OPENSSH PRIVATE KEY header" || echo "No BEGIN OPENSSH PRIVATE KEY header"
            printf '%s' "$SSH_KEY" | grep -q '^ssh-' && echo "Looks like a PUBLIC key (starts with ssh-); the private key is needed"
            printf '%s' "$SSH_KEY" | grep -qiE 'Get-Content|Set-Clipboard' && echo "Looks like the PowerShell command was pasted instead of its output"
            echo "::error::FOURSYS_SSH_KEY is not a readable private key. Re-paste the whole file, from -----BEGIN to -----END (docs/deployment.md, section 6)."
            exit 1
          fi
          echo "Deploy key fingerprint: $(ssh-keygen -lf ~/.ssh/foursys)"
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host bukidbasket
              HostName ssh.foursyscloud.com
              Port 65002
              User fs000031
              IdentityFile ~/.ssh/foursys
              IdentitiesOnly yes
              StrictHostKeyChecking yes
          EOF

      - name: Deploy
        run: bash scripts/deploy.sh "$GITHUB_SHA"

      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 https://orange-cobra-186442.foursyscloud.com/)
          echo "Home page returned HTTP $code"
          [ "$code" = "200" ]

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/foursys
